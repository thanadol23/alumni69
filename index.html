<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f3;--card:#fff;--tx:#1f2937;--mu:#6b7280;--br:#d9e0dc;--in:#f8fafc;--g:#059669;--free:#10b981;--pen:#f59e0b;--bkd:#f26b6b;--zone:#e3ebe6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--card:#18211e;--tx:#e8eeeb;--mu:#9aa8a2;--br:#2c3a35;--in:#1e2a26;--zone:#22302b}}
:root[data-theme="dark"]{--bg:#0f1513;--card:#18211e;--tx:#e8eeeb;--mu:#9aa8a2;--br:#2c3a35;--in:#1e2a26;--zone:#22302b}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Prompt",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 12px 40px}
h1{margin:0;text-align:center;color:var(--g);font-size:26px}
.sub{text-align:center;color:var(--mu);margin:4px 0 14px;font-size:14px}
.leg{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.leg div{flex:1;max-width:200px;border:1px solid;border-radius:14px;padding:10px 6px;text-align:center}
.leg b{display:block;font-size:13px;font-weight:600}.leg span{font-size:26px;font-weight:600}
.leg .f{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25);color:#10b981}
.leg .p{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25);color:#f59e0b}
.leg .k{background:rgba(242,107,107,.1);border-color:rgba(242,107,107,.25);color:#f26b6b}
.free{background:var(--free)}.pending{background:var(--pen)}.booked{background:var(--bkd)}
.note{text-align:center;font-size:12px;color:var(--mu);margin:0 0 12px}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.zh{background:var(--zone);border-radius:10px;padding:8px 12px;font-weight:600;margin:16px 0 10px;display:flex;justify-content:space-between;font-size:15px}
.zh span{color:var(--mu);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr) 16px repeat(3,1fr) 16px repeat(2,1fr) 16px repeat(3,1fr);gap:10px 6px;align-items:start}
.ai{background:var(--zone);border-radius:10px;align-self:stretch}
.mc{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;margin:16px 0 14px;align-items:center}
.mc .ai{height:36px}
.con{background:#1e293b;color:#fff;border-radius:10px;padding:16px 8px;text-align:center;font-size:12px;font-weight:600;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.kn{background:#eef2f7;color:#1f2937;border-left:4px solid #64748b;border-radius:4px 8px 8px 4px;padding:8px 12px;font-size:14px;font-weight:600;margin:0 0 12px;width:fit-content;max-width:100%}
#zones{margin-top:14px}
.vip{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#111;font-size:8px;font-style:normal;font-weight:600;padding:0 5px;border-radius:6px;z-index:1}
.c{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr) 8px repeat(3,1fr) 8px repeat(2,1fr) 8px repeat(3,1fr);gap:8px 3px}.nm{font-size:8px}.t{font-size:10px}}
.t{width:100%;aspect-ratio:1;border:0;border-radius:50%;color:#fff;font:600 clamp(11px,3.3vw,16px) "Prompt",sans-serif;cursor:pointer;max-width:56px}
.t:active{transform:scale(.94)}
.zb::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-6px;height:3px;background:color-mix(in srgb,var(--mu) 40%,var(--bg))}

.nm{font-size:10px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:14px}
.ov{position:fixed;inset:0;background:rgba(15,23,20,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov[hidden]{display:none}
.md{background:var(--card);border-radius:22px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:22px 20px}
.md h2{margin:0 0 14px;text-align:center;color:var(--g);font-size:22px;padding-bottom:12px;border-bottom:1px solid var(--br)}
.tabs{display:flex;background:var(--in);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font:500 14px "Prompt",sans-serif;color:var(--mu);cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
input{width:100%;border:1px solid var(--br);background:var(--in);color:var(--tx);border-radius:12px;padding:13px 14px;font:400 15px "Prompt",sans-serif;margin-bottom:10px}
.two{display:flex;gap:10px}.two input{min-width:0}
.lb{font-size:12px;color:var(--mu);margin:0 0 4px 2px}
.up{border:2px dashed var(--br);border-radius:14px;text-align:center;padding:18px 10px;cursor:pointer;margin-bottom:12px;color:var(--mu);font-size:15px}
.up small{display:block;color:var(--g);font-weight:500;margin-top:6px}
.up img{max-width:100%;max-height:180px;border-radius:8px}
.bk{background:var(--in);border:1px solid var(--br);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;white-space:pre-line}
.b{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px "Prompt",sans-serif;cursor:pointer;margin-top:8px;background:var(--in);color:var(--tx)}
.b.p{background:var(--g);color:#fff;box-shadow:0 6px 16px rgba(5,150,105,.3)}
.b.d{background:#fde8ea;color:#b42335}
.info p{margin:6px 0;font-size:15px}.info b{color:var(--mu);font-weight:500}
.info img{max-width:100%;border-radius:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:30}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>50 ปี วังน้ำคู้ศึกษา</h1>
  <p class="sub">ระบบจองโต๊ะจีนออนไลน์ (1 โต๊ะ = 8 ที่นั่ง)</p>
  <div id="warn" class="warn" hidden>โหมดทดลอง: ข้อมูลการจองบันทึกในเครื่องนี้เท่านั้น ยังไม่แชร์ให้คนอื่นเห็น</div>
  <div class="leg" id="leg"></div>
  <p class="note">แตะที่โต๊ะสีเขียวเพื่อจอง</p>
  <div id="zones"></div>
</div>
<div class="ov" id="ov" hidden><div class="md" id="md"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxJ8w321BikF7z3dqy93sXXQsWbDx7QcVvD-c1SXjFP573wZUbfhE7LgxJYEdc1Tq0y/exec"; // วาง URL ของ Apps Script Web app (ลงท้าย /exec) ที่นี่
let KEY = new URLSearchParams(location.search).get("admin") || ""; // ผู้ดูแลเปิดหน้านี้ด้วย ?admin=รหัส
const BANK = ""; // ใส่ข้อมูลบัญชีรับโอน เช่น "ธนาคาร ... เลขที่บัญชี ... ชื่อบัญชี ..."
const R = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const TOTAL = 165; // จำนวนโต๊ะทั้งหมด
// ผังตามแบบวาด (17 แถว): ซ้าย = โซน 1-2 (โต๊ะ 1-112 ฝั่งละ 7 คอลัมน์ เรียงทีละแถว)
// ขวา = โซน 3 (113-133) + 134-154 (3 คอลัมน์ เรียงลงตามคอลัมน์) + โซน 4 แถม (155-160) / แถวล่างสุด 161-165 (null = ช่องว่าง)
const LAYOUT = Array.from({length: 17}, (_, r) => {
  const left = r < 16 ? R(r * 7 + 1, r * 7 + 7) : [null, null, null, null, null, 161, 162];
  let right;
  if (r < 7) right = [113 + r, 120 + r, 127 + r];
  else if (r < 14) right = [134 + r - 7, 141 + r - 7, 148 + r - 7];
  else if (r === 14) right = [155, 156, 157];
  else if (r === 15) right = [158, 159, 160];
  else right = [163, 164, 165];
  return left.concat(right);
});
const LB = [7, 15];      // เส้นกั้นฝั่งซ้าย: ใต้แถว 8 (โซน 1/2) และแถว 16 (โซน 2 / แถวล่างสุด)
const RB = [7, 15];      // เส้นกั้นฝั่งขวา: ใต้แถว 8 (134-148) และแถว 16 (158-160)
const VIP = [3, 4, 5];
const ST = {free: "เหลือว่าง", pending: "รอตรวจสอบ", booked: "จองแล้ว"};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LS = "wnks69-tables";
let D = {}, col = null, shared = false, admin = false, cur = null, meth = "transfer", slip = "";

const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify(D)); } catch (e) {} };
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

function render() {
  let n = {pending: 0, booked: 0};
  Object.values(D).forEach(d => { if (d && n[d.status] != null) n[d.status]++; });
  $("#leg").innerHTML =
    `<div class="f"><b>${ST.free}</b><span>${TOTAL - n.pending - n.booked}</span></div>` +
    `<div class="p"><b>${ST.pending}</b><span>${n.pending}</span></div>` +
    `<div class="k"><b>${ST.booked}</b><span>${n.booked}</span></div>`;
  const cell = (id, zb, side) => {
    if (!id) return `<div></div>`;
    const d = D["T" + id], s = d && ST[d.status] ? d.status : "free";
    return `<div class="c${zb ? " zb" + (side ? " " + side : "") : ""}">${VIP.includes(id) ? '<i class="vip">VIP</i>' : ""}<button class="t ${s}" data-id="${id}" aria-label="โต๊ะ ${id} ${ST[s]}">${id}</button><span class="nm">${esc(d ? d.name : "")}</span></div>`;
  }, ai = `<div class="ai"></div>`;
  const h = LAYOUT.map((row, r) => {
    const c = row.map((id, i) => cell(id, (i < 7 ? LB : RB).includes(r)));
    return c.slice(0, 2).join("") + ai + c.slice(2, 5).join("") + ai + c.slice(5, 7).join("") + ai + c.slice(7).join("");
  }).join("");
  $("#zones").innerHTML = `<div class="mc"><div class="ai"></div><div class="con">🎵 Music Console</div><div class="ai"></div></div><div class="grid">${h}</div>`;
  $("#warn").hidden = shared;
}

function open(id) {
  cur = id; slip = ""; meth = "transfer";
  const d = D["T" + id], md = $("#md");
  if (!d) {
    md.innerHTML = `<h2>จองโต๊ะ T${id}</h2>
    <div class="tabs"><button data-m="transfer" class="on">💳 โอนเงิน</button><button data-m="cash">💵 ชำระเงินสด</button></div>
    ${BANK ? `<div class="bk" id="bank">${esc(BANK)}</div>` : ""}
    <input id="f-name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" autocomplete="name">
    <input id="f-cls" placeholder="ศิษย์เก่ารุ่นที่ (ถ้ามี)">
    <input id="f-tel" type="tel" placeholder="เบอร์โทรศัพท์" autocomplete="tel">
    <p class="lb" id="dl">วันที่ / เวลาที่โอนเงิน</p>
    <div class="two"><input id="f-date" type="date"><input id="f-time" type="time"></div>
    <div class="up" id="up">📥<br>คลิกเพื่อแนบสลิปโอนเงิน<small>รับเฉพาะรูปภาพไม่เกิน 5MB</small></div>
    <input id="f-file" type="file" accept="image/*" hidden>
    <button class="b p" data-a="ok">ยืนยันการจอง</button><button class="b" data-a="x">ยกเลิก</button>`;
  } else {
    const adm = admin ? `<p><b>เบอร์โทร:</b> ${esc(d.phone)}</p><p><b>ชำระโดย:</b> ${d.method === "cash" ? "เงินสด" : "โอนเงิน"} ${esc(d.date)} ${esc(d.time)}</p>` +
      (d.slip && d.slip.startsWith("https://drive.google.com/") ? `<p><a href="${esc(d.slip)}" target="_blank" rel="noopener">ดูสลิปโอนเงิน</a></p>` : d.slip && d.slip.startsWith("data:image/") ? `<img src="${d.slip}" alt="สลิป">` : "") : "";
    md.innerHTML = `<h2>โต๊ะ T${id}</h2><div class="info"><p><b>สถานะ:</b> ${ST[d.status] || ""}</p><p><b>ผู้จอง:</b> ${esc(d.name)}</p>${d.cls ? `<p><b>รุ่นที่:</b> ${esc(d.cls)}</p>` : ""}${adm}</div>` +
      (admin ? (d.status !== "booked" ? `<button class="b p" data-a="cf">ยืนยันว่าจองแล้ว</button>` : "") + `<button class="b d" data-a="rm">ปล่อยโต๊ะ (ลบการจอง)</button>` : "") +
      `<button class="b" data-a="x">ปิด</button>`;
  }
  $("#ov").hidden = false;
}
const close = () => { $("#ov").hidden = true; cur = null; };

function setMeth(m) {
  meth = m;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  const t = m === "transfer";
  $("#up").hidden = !t; if ($("#bank")) $("#bank").hidden = !t;
  $("#dl").textContent = t ? "วันที่ / เวลาที่โอนเงิน" : "วันที่ / เวลานัดชำระเงินสด";
}

function pack(f) {
  return new Promise((ok, no) => {
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      let q = .7, s = c.toDataURL("image/jpeg", q);
      while (s.length > 180000 && q > .3) { q -= .1; s = c.toDataURL("image/jpeg", q); }
      ok(s);
    };
    im.onerror = no; im.src = u;
  });
}

async function api(b) {
  const r = await fetch(API, {method: "POST", body: JSON.stringify(b)});
  const t = await r.text(); let j;
  try { j = JSON.parse(t); } catch (e) { throw new Error("ระบบหลังบ้านตอบกลับผิดรูปแบบ: " + t.slice(0, 120)); }
  if (!j.ok) throw new Error(j.error || "fail"); return j;
}
async function put(id, doc) {
  if (API) { await api({action: "book", id: "T" + id, doc}); await load().catch(() => {}); }
  else { D["T" + id] = doc; lsSave(); render(); }
}
async function setSt(id, st) {
  if (API) { await api({action: "status", id: "T" + id, status: st, key: KEY}); await load(); }
  else { D["T" + id] = {...D["T" + id], status: st}; lsSave(); render(); }
}
async function del(id) {
  if (API) { await api({action: "release", id: "T" + id, key: KEY}); await load(); }
  else { delete D["T" + id]; lsSave(); render(); }
}

async function submit() {
  const g = k => $("#f-" + k).value.trim();
  if (!g("name")) return toast("กรุณากรอกชื่อ-นามสกุล");
  if (!/^[0-9+\-\s]{8,}$/.test(g("tel"))) return toast("กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง");
  if (meth === "transfer" && !slip) return toast("กรุณาแนบสลิปโอนเงิน");
  const id = cur;
  try {
    await put(id, {status: "pending", method: meth, name: g("name"), cls: g("cls"), phone: g("tel"), date: g("date"), time: g("time"), slip: meth === "transfer" ? slip : "", ts: Date.now()});
    close(); toast("จองโต๊ะ T" + id + " เรียบร้อย รอตรวจสอบ");
  } catch (e) { if (e.message === "taken") { toast("โต๊ะนี้มีคนจองแล้ว"); close(); load().catch(() => {}); } else { console.error(e); toast("บันทึกไม่สำเร็จ: " + (e.message || e)); } }
}

document.addEventListener("click", async e => {
  const t = e.target.closest(".t");
  if (t) return open(t.dataset.id);
  if (e.target.id === "ov") return close();
  const m = e.target.closest("[data-m]"); if (m) return setMeth(m.dataset.m);
  if (e.target.closest("#up")) return $("#f-file").click();
  const a = e.target.closest("[data-a]"); if (!a) return;
  const id = cur, d = D["T" + id];
  try {
    if (a.dataset.a === "x") close();
    else if (a.dataset.a === "ok") submit();
    else if (a.dataset.a === "cf" && d) { await setSt(id, "booked"); close(); toast("ยืนยันการจองแล้ว"); }
    else if (a.dataset.a === "rm" && confirm("ปล่อยโต๊ะ T" + id + " ?")) { await del(id); close(); toast("ปล่อยโต๊ะแล้ว"); }
  } catch (err) { toast("ทำรายการไม่สำเร็จ"); }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "f-file") return;
  const f = e.target.files[0]; if (!f) return;
  if (!f.type.startsWith("image/") || f.size > 5 * 1024 * 1024) return toast("รับเฉพาะรูปภาพไม่เกิน 5MB");
  try { slip = await pack(f); $("#up").innerHTML = `<img src="${slip}" alt="สลิป"><small>แตะเพื่อเปลี่ยนรูป</small>`; } catch (err) { toast("อ่านรูปไม่ได้"); }
});

async function load() {
  const r = await fetch(API + "?action=list&key=" + encodeURIComponent(KEY));
  const j = await r.json(); if (!j.ok) throw new Error("load");
  D = j.tables || {}; admin = !!j.admin; shared = true; render();
}
function local() { shared = false; admin = true; D = lsLoad(); render(); }
function init() {
  render();
  if (!API) return local();
  const fail = () => { shared = false; $("#warn").textContent = "เชื่อมต่อระบบไม่ได้ กำลังลองใหม่..."; render(); };
  load().catch(fail);
  setInterval(() => { if ($("#ov").hidden) load().catch(fail); }, 15000);
}
init();
</script>
</body>
</html>
